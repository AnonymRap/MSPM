name: Sync Knowledge Base

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil Edge Function sync-kb
        run: |
          curl -f -sS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/sync-kb" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json"

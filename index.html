<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asisten Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0F;
    --sidebar:#131318;
    --surface:#1A1A21;
    --surface-2:#20202A;
    --border:#2A2A33;
    --border-strong:#38383F;
    --text:#EDEDF2;
    --text-muted:#96969F;
    --text-faint:#63636C;
    --accent:#7C6CFF;
    --accent-hover:#8F82FF;
    --accent-dim:rgba(124,108,255,0.14);
    --accent-glow:rgba(124,108,255,0.35);
    --success:#3ECF8E;
    --success-dim:rgba(62,207,142,0.14);
    --warning:#F5A623;
    --danger:#F8717A;
    --danger-dim:rgba(248,113,122,0.14);
    --radius:10px;
    --radius-sm:7px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{height:100vh;}

  /* ================= App Shell ================= */
  .app-shell{display:grid;grid-template-columns:280px 1fr;height:100vh;}
  .sidebar-scrim{display:none;}
  @media(max-width:820px){
    .app-shell{grid-template-columns:1fr;}
    .sidebar{position:fixed;inset:0 auto 0 0;width:280px;z-index:50;
      transform:translateX(-100%);transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);}
    .sidebar-scrim{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;display:none;}
    .sidebar-scrim.show{display:block;}
    .mobile-toggle{display:flex !important;}
  }

  /* ================= Sidebar ================= */
  .sidebar{
    background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 16px;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 4px 20px;}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),#4C8BF5);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 20px var(--accent-glow);
  }
  .brand-mark svg{width:16px;height:16px;}
  .brand-name{font-weight:600;font-size:14.5px;letter-spacing:-0.01em;}
  .brand-sub{font-size:11px;color:var(--text-faint);margin-top:1px;}

  .side-section{margin-top:6px;padding-top:18px;border-top:1px solid var(--border);}
  .side-section:first-of-type{border-top:none;}
  .side-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-faint);
    font-weight:600;margin:0 0 10px 4px;
  }

  .side-btn{
    width:100%;display:flex;align-items:center;gap:8px;
    background:transparent;border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
    cursor:pointer;font-family:inherit;transition:all .15s ease;margin-bottom:8px;
  }
  .side-btn:hover{background:var(--surface-2);border-color:var(--border-strong);}
  .side-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .side-btn svg{width:14px;height:14px;flex-shrink:0;opacity:0.8;}
  .side-btn.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  }
  .side-btn.primary:hover{background:var(--accent-hover);box-shadow:0 0 16px var(--accent-glow);}

  .sync-status{font-size:11.5px;color:var(--text-faint);padding:2px 4px;line-height:1.6;min-height:16px;}
  .sync-status.ok{color:var(--success);}
  .sync-status.err{color:var(--danger);}

  .doc-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .doc-item{
    display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:var(--radius-sm);
    font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;
  }
  .doc-item svg{width:12px;height:12px;flex-shrink:0;opacity:0.6;}
  .doc-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-empty{font-size:12px;color:var(--text-faint);padding:8px 4px;font-style:italic;}

  .side-spacer{flex:1;}
  .user-card{
    display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--radius-sm);
    border:1px solid var(--border);margin-top:10px;
  }
  .avatar{
    width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#4C8BF5);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    color:#fff;flex-shrink:0;
  }
  .user-meta{overflow:hidden;flex:1;}
  .user-email{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-role{font-size:10.5px;color:var(--text-faint);}
  .icon-btn{
    background:transparent;border:none;color:var(--text-faint);cursor:pointer;
    padding:5px;border-radius:6px;display:flex;transition:all .15s ease;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--danger);}
  .icon-btn svg{width:15px;height:15px;}

  .mobile-toggle{
    display:none;position:fixed;top:14px;left:14px;z-index:60;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    width:36px;height:36px;align-items:center;justify-content:center;color:var(--text);cursor:pointer;
  }

  /* ================= Main / Chat ================= */
  .main{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .main-header{
    padding:16px 28px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .main-header h1{font-size:15px;font-weight:600;margin:0;}
  .main-header .sub{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .badge{
    font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;
    background:var(--success-dim);color:var(--success);letter-spacing:0.02em;
  }

  .chat-scroll{flex:1;overflow-y:auto;padding:24px 0 12px;}
  .chat-inner{max-width:720px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;gap:22px;}

  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:60px 20px;color:var(--text-muted);
  }
  .empty-state .icon-wrap{
    width:52px;height:52px;border-radius:14px;background:var(--accent-dim);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  }
  .empty-state .icon-wrap svg{width:24px;height:24px;color:var(--accent);}
  .empty-state h2{font-size:16px;color:var(--text);margin:0 0 6px;font-weight:600;}
  .empty-state p{font-size:13px;margin:0 0 22px;max-width:340px;line-height:1.6;}

  .suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px;}
  .chip{
    background:var(--surface);border:1px solid var(--border);color:var(--text-muted);
    padding:8px 14px;border-radius:99px;font-size:12.5px;cursor:pointer;
    transition:all .15s ease;font-family:inherit;
  }
  .chip:hover{border-color:var(--accent);color:var(--text);background:var(--accent-dim);}

  .msg-row{display:flex;gap:12px;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .msg-avatar{
    width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:11px;font-weight:700;margin-top:2px;
  }
  .msg-row.user .msg-avatar{background:var(--surface-2);color:var(--text-muted);}
  .msg-row.bot .msg-avatar{background:linear-gradient(135deg,var(--accent),#4C8BF5);color:#fff;}
  .msg-body{flex:1;min-width:0;}
  .msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .msg-name{font-size:12.5px;font-weight:600;}
  .msg-time{font-size:11px;color:var(--text-faint);}
  .msg-text{
    font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;
  }
  .msg-row.user .msg-text{color:var(--text-muted);}

  .msg-sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .source-chip{
    display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--text-faint);border:1px solid var(--border);padding:3px 8px;border-radius:6px;
  }
  .source-chip svg{width:10px;height:10px;opacity:0.7;}

  .msg-actions{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .15s ease;}
  .msg-row.bot:hover .msg-actions{opacity:1;}
  .msg-actions button{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:4px;transition:all .15s ease;
  }
  .msg-actions button:hover{color:var(--text);border-color:var(--border-strong);}
  .msg-actions svg{width:11px;height:11px;}

  .typing-dots{display:flex;gap:4px;padding:6px 0;}
  .typing-dots span{
    width:6px;height:6px;border-radius:50%;background:var(--text-faint);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:0.15s;}
  .typing-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}

  /* ================= Composer ================= */
  .composer-wrap{padding:14px 28px 20px;flex-shrink:0;}
  .composer{
    max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:flex-end;gap:8px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .composer textarea{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-family:inherit;font-size:13.5px;line-height:1.5;resize:none;max-height:160px;
    padding:8px 0;
  }
  .composer textarea::placeholder{color:var(--text-faint);}
  .send-btn{
    width:34px;height:34px;border-radius:9px;background:var(--accent);border:none;
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
    flex-shrink:0;transition:all .15s ease;
  }
  .send-btn:hover{background:var(--accent-hover);box-shadow:0 0 14px var(--accent-glow);}
  .send-btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}
  .send-btn svg{width:15px;height:15px;}
  .composer-hint{
    text-align:center;font-size:11px;color:var(--text-faint);margin-top:9px;
  }
  .composer-hint kbd{
    background:var(--surface-2);border:1px solid var(--border);border-radius:4px;
    padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:10px;
  }

  /* ================= Login ================= */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .login-box{width:360px;padding:36px 34px;background:var(--surface);border:1px solid var(--border);border-radius:16px;}
  .login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:26px;}
  .login-brand .brand-mark{width:44px;height:44px;border-radius:12px;margin-bottom:14px;}
  .login-brand .brand-mark svg{width:22px;height:22px;}
  .login-box h1{font-size:18px;margin:0 0 4px;text-align:center;font-weight:700;}
  .login-box p{color:var(--text-faint);font-size:12.5px;margin:0;text-align:center;}
  .login-box label{
    display:block;font-size:12px;color:var(--text-muted);margin:18px 0 6px;font-weight:500;
  }
  .login-box input{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13.5px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .login-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .login-box button{
    width:100%;margin-top:20px;padding:11px;background:var(--accent);color:#fff;border:none;
    border-radius:var(--radius-sm);font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600;
    transition:all .15s ease;
  }
  .login-box button:hover{background:var(--accent-hover);box-shadow:0 0 16px var(--accent-glow);}
  .login-box button:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none;}
  .alert{font-size:12px;margin-top:14px;padding:9px 11px;border-radius:var(--radius-sm);}
  .alert.error{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(248,113,122,0.3);}

  .setup-warning{
    max-width:520px;margin:80px auto;padding:24px 28px;border:1px solid var(--danger);
    background:var(--danger-dim);font-size:14px;line-height:1.6;color:var(--text);border-radius:12px;
  }
  .setup-warning code{background:rgba(248,113,122,0.18);padding:1px 5px;border-radius:4px;color:var(--danger);}
</style>
</head>

};

const app = document.getElementById('app');
let supabaseClient = null;
let session = null;

function configured(){
  return SUPABASE_URL.startsWith("http") && !SUPABASE_ANON_KEY.startsWith("GANTI");
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function timeNow(){
  return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function renderSetupWarning(){
  app.innerHTML = `<div class="setup-warning"><strong>Konfigurasi belum lengkap.</strong><br><br>

    <code>GITHUB_REPO</code> di bagian atas <code>index.html</code>. Panduan lengkap ada di
    <code>README.md</code>.</div>`;
}

function renderLogin(){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div class="login-brand">
          <div class="brand-mark">${ICONS.bolt}</div>
          <h1>Asisten Knowledge Base</h1>
          <p>Masuk untuk tanya-jawab dokumen tim</p>
        </div>
        <form id="authForm">
          <label>Email</label>
          <input type="email" name="email" required autocomplete="email">
          <label>Kata sandi</label>
          <input type="password" name="password" required minlength="6" autocomplete="current-password">
          <button type="submit">Masuk</button>
        </form>
        <div id="authMsg"></div>
      </div>
    </div>`;

  document.getElementById('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button');
    const msgEl = document.getElementById('authMsg');
    msgEl.innerHTML = '';
    btn.disabled = true; btn.textContent = 'Memproses…';

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: fd.get('email'), password: fd.get('password')
    });
    if (error) {
      btn.disabled = false; btn.textContent = 'Masuk';
      msgEl.innerHTML = `<div class="alert error">Akses ditolak: email atau kata sandi salah.</div>`;
      return;
    }
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    session = s;
    renderPage();
  };
}

function displayName(){ return session?.user?.email?.split('@')[0] || 'Anda'; }
function initials(){ return displayName().slice(0,2).toUpperCase(); }

async function renderPage(){
  app.innerHTML = `
    <div class="app-shell">

          </div>
          <button class="icon-btn" id="signOut" title="Keluar">${ICONS.logout}</button>
        </div>
      </aside>

      <div class="main">
        <div class="main-header">
          <div>
            <h1>Tanya Knowledge Base</h1>
            <div class="sub">Jawaban selalu bersumber dari dokumen tim</div>
          </div>
          <span class="badge">● Online</span>
        </div>

        <div class="chat-scroll" id="chatScroll">
          <div class="chat-inner" id="chatInner">
            <div class="empty-state" id="emptyState">
              <div class="icon-wrap">${ICONS.bolt}</div>
              <h2>Mulai percakapan</h2>
              <p>Tanyakan apa saja tentang dokumen yang sudah disinkronkan dari GitHub.</p>
              <div class="suggestions" id="suggestions"></div>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="askForm">
            <textarea id="questionInput" rows="1" placeholder="Tulis pertanyaan…" required></textarea>
            <button type="submit" class="send-btn" id="askBtn">${ICONS.send}</button>
          </form>
          <div class="composer-hint"><kbd>Enter</kbd> kirim &nbsp;·&nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd> baris baru</div>
        </div>
      </div>
    </div>`;

  const sugWrap = document.getElementById('suggestions');
  SUGGESTED_PROMPTS.forEach(p => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = p;
    chip.onclick = () => { submitQuestion(p); };
    sugWrap.appendChild(chip);
  });

  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  document.getElementById('mobileToggle').onclick = () => { sidebar.classList.add('open'); scrim.classList.add('show'); };
  scrim.onclick = () => { sidebar.classList.remove('open'); scrim.classList.remove('show'); };

  document.getElementById('signOut').onclick = async () => {
    await supabaseClient.auth.signOut();
    session = null;
    renderLogin();
  };
  document.getElementById('syncBtn').onclick = syncFromGithub;

  const textarea = document.getElementById('questionInput');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
  });
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('askForm').requestSubmit();
    }
  });
  document.getElementById('askForm').onsubmit = (e) => {
    e.preventDefault();
    submitQuestion(textarea.value.trim());
  };

  refreshDocList();
}

function setSyncStatus(msg, cls){
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.className = 'sync-status' + (cls ? ' ' + cls : '');
}

async function refreshDocList(){
  const { data, error } = await supabaseClient
    .from('kb_chunks')
    .select('source_path')
    .order('source_path');
  const listEl = document.getElementById('docList');
  const countEl = document.getElementById('docCount');
  if (error || !data || data.length === 0) {
    listEl.innerHTML = `<div class="doc-empty">Belum ada dokumen.</div>`;
    countEl.textContent = '0';
    return;
  }
  const unique = [...new Set(data.map(d => d.source_path))];
  countEl.textContent = unique.length;
  listEl.innerHTML = unique.map(p => `
    <div class="doc-item">${ICONS.doc}<span title="${escapeHtml(p)}">${escapeHtml(p.split('/').pop())}</span></div>
  `).join('');
}

async function syncFromGithub(){
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  setSyncStatus('Mengambil daftar file dari GitHub…');

  try {
    const treeRes = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`
    );
    if (!treeRes.ok) throw new Error(`GitHub API error (${treeRes.status}). Pastikan repo publik & nama benar.`);
    const tree = await treeRes.json();

    const prefix = DOCS_FOLDER ? DOCS_FOLDER.replace(/\/$/, '') + '/' : '';
    const files = (tree.tree || []).filter(f =>
      f.type === 'blob' && f.path.startsWith(prefix) && /\.(md|txt)$/i.test(f.path)
    );

    if (files.length === 0) {
      setSyncStatus('Tidak ada file .md/.txt ditemukan di folder tersebut.', 'err');
      btn.disabled = false;
      return;
    }

    let done = 0;
    for (const f of files) {
      setSyncStatus(`Memproses ${done + 1}/${files.length}: ${f.path}`);
      const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${f.path}`;
      const contentRes = await fetch(rawUrl);
      if (!contentRes.ok) { done++; continue; }
      const content = await contentRes.text();

      await supabaseClient.from('kb_chunks').delete().eq('source_path', f.path);

      const chunkSize = 1500;
      const chunks = [];
      for (let i = 0; i < content.length; i += chunkSize) chunks.push(content.slice(i, i + chunkSize));
      const rows = chunks.map(c => ({ source_path: f.path, title: f.path.split('/').pop(), content: c }));
      await supabaseClient.from('kb_chunks').insert(rows);
      done++;
    }
    setSyncStatus(`✓ ${files.length} dokumen tersinkron (${new Date().toLocaleTimeString('id-ID')})`, 'ok');
    refreshDocList();
  } catch (e) {
    setSyncStatus('Error: ' + e.message, 'err');
  }
  btn.disabled = false;
}

function appendMessage(role, html){
  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  const chatInner = document.getElementById('chatInner');
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const avatar = role === 'user' ? initials() : ICONS.bolt;
  row.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-name">${role === 'user' ? 'Anda' : 'Asisten'}</span>
        <span class="msg-time">${timeNow()}</span>
      </div>
      <div class="msg-text">${html}</div>
    </div>`;
  chatInner.appendChild(row);
  document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
  return row;
}

function appendTyping(){
  const chatInner = document.getElementById('chatInner');
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `
    <div class="msg-avatar">${ICONS.bolt}</div>
    <div class="msg-body">
      <div class="msg-meta"><span class="msg-name">Asisten</span></div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  chatInner.appendChild(row);
  document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
}
function removeTyping(){
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

async function submitQuestion(question){
  if (!question) return;
  const textarea = document.getElementById('questionInput');
  const askBtn = document.getElementById('askBtn');

  appendMessage('user', escapeHtml(question));
  textarea.value = '';
  textarea.style.height = 'auto';
  askBtn.disabled = true;
  appendTyping();

  try {
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/ask-kb`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${s.access_token}`,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    removeTyping();

    const sourcesHtml = (data.sources || []).length
      ? `<div class="msg-sources">${data.sources.map(s => `<span class="source-chip">${ICONS.doc}${escapeHtml(s.split('/').pop())}</span>`).join('')}</div>`
      : '';
    const answerText = data.answer || data.error || 'Tidak ada jawaban.';
    const row = appendMessage('bot', escapeHtml(answerText) + sourcesHtml);

    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.innerHTML = `<button type="button" data-copy>${ICONS.copy} Salin</button>`;
    row.querySelector('.msg-body').appendChild(actions);
    actions.querySelector('[data-copy]').onclick = (ev) => {
      navigator.clipboard.writeText(answerText);
      ev.currentTarget.innerHTML = `${ICONS.check} Disalin`;
      setTimeout(() => { ev.currentTarget.innerHTML = `${ICONS.copy} Salin`; }, 1500);
    };
  } catch (err) {
    removeTyping();
    appendMessage('bot', `Gagal menghubungi asisten: ${escapeHtml(err.message)}`);
  }
  askBtn.disabled = false;
}

async function main(){
  if (!configured()){ renderSetupWarning(); return; }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session: s } } = await supabaseClient.auth.getSession();
  session = s;
  if (session) renderPage();
  else renderLogin();
}
main();
</script>
